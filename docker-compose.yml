# Local Postgres for development: `docker compose up -d db` then `npm run migrate`
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kobo
    ports:
      - "5432:5432"
    volumes:
      - kobo-pg:/var/lib/postgresql/data
volumes:
  kobo-pg:
